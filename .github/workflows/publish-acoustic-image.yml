name: Publish Acoustic GPU Image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build And Publish Immutable Candidate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish candidate
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/quran-acoustic-evaluator/Dockerfile.gpu
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/quran-acoustic-evaluator:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
